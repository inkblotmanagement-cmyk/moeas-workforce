name: CI

on:
  push:
    branches: [main, public-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with JMGL from GitHub main)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[jmgl,server,test]"
      - name: Show JMGL version
        run: python -c "import jmgl, importlib.metadata as m; print('jmgl', m.version('jmgl'), jmgl.__file__)"
      - name: Test
        run: pytest -q -rx
      - name: Fail-closed check without JMGL
        run: |
          pip uninstall -y jmgl
          python -c "from moeas import MindfulOracle; r=MindfulOracle().answer_call('hello'); assert r['decision']=='BLOCK', r; print('fail-closed OK')"
